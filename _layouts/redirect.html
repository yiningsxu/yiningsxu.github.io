<!doctype html>
<html lang="{{ page.lang | default: site.default_lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }} | {{ site.name | escape }}</title>
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url | escape }}">
    <link rel="canonical" href="{{ page.redirect_to | split: '#' | first | absolute_url }}">
  </head>
  <body>
    <p>
      <a href="{{ page.redirect_to | relative_url | escape }}">
        {% if page.lang == 'ja' %}感染症の「その他」ページへ移動します。{% else %}Continue to Infectious Diseases: Others.{% endif %}
      </a>
    </p>
  </body>
</html>
