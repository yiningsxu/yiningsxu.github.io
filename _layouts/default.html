<!doctype html>
<html lang="{{ page.lang | default: site.default_lang | default: 'en' }}">
  {% include head.html %}

  <body class="layout-{{ page.layout | default: 'default' }} lang-{{ page.lang | default: site.default_lang | default: 'en' }}">
    <a class="skip-link" href="#main-content">{% if page.lang == 'ja' %}本文へ移動{% else %}Skip to main content{% endif %}</a>
    {% include header.html %}

    <main class="page-content" id="main-content" tabindex="-1">
      <div class="wrapper">{{ content }}</div>
    </main>

    {% include footer.html %} {% include hemline.html %}
  </body>
</html>
