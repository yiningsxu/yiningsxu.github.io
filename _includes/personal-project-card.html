{% assign personal_project = include.project %}
<article class="project">
  <a
    class="project__link"
    {% if personal_project.redirect %}
      href="{{ personal_project.redirect }}" target="_blank" rel="noopener noreferrer"
    {% else %}
      href="{{ personal_project.url | relative_url }}"
    {% endif %}
  >
    <div class="project__media">
      {% if personal_project.img %}
        <img
          src="{{ personal_project.img | relative_url }}"
          alt=""
          width="1600"
          height="1000"
          loading="lazy"
          decoding="async"
        >
      {% else %}
        <div class="blankbox"></div>
      {% endif %}
    </div>
    <div class="project__body">
      <h3 class="project__title">
        {{- personal_project.title -}}
        {%- if personal_project.redirect %} <span aria-hidden="true">↗</span>{% endif -%}
      </h3>
      <p class="project__description">{{ personal_project.description }}</p>
    </div>
  </a>
</article>
